
 name: code-review-assistant
 version: "1.0.0"
 description: "Code Review Assistant - Professional Code Quality Inspection Intelligence"

 # Depended sanityops_agent version
 framework:
   name: sanityops_agent
   version: ">=0.1.1"

 # System prompt word configuration
 system_prompt:
   file: prompts/system.txt

 # Skill registration
 skills:
   - name: code-review
     path: skills/code-review/
     enabled: true

 # Model configuration
 models:
   default: gpt-4
   configs:
     gpt-4:
       temperature: 0.3
       max_tokens: 4096

 # Tool configuration
 tools:
   config_file: config/tools.yaml
