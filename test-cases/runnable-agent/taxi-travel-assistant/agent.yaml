name: taxi-travel-assistant
version: "1.0.0"
description: "Taxi Travel Assistant - Intelligent Travel Service for Passengers"

framework:
  name: sanityops_agent
  version: ">=0.3.2"

system_prompt:
  file: prompts/system.txt

skills:
  - name: route_planning
    path: skills/route_planning/
    enabled: true
  - name: fare_estimation
    path: skills/fare_estimation/
    enabled: true
  - name: vehicle_query
    path: skills/vehicle_query/
    enabled: true
  - name: order_booking
    path: skills/order_booking/
    enabled: true

models:
  default: claude-sonnet-5
  configs:
    claude-sonnet-5:
      temperature: 0.7
      max_tokens: 4096

tools:
  config_file: config/tools.yaml
