# Tool registration and configuration
# Follow the MCP Tool Schema specification and use inputSchema
tools:
  - name: dispatch_engine
    description: "Intelligent distribution engine: automatically matches the undertaking department and determines the degree of urgency according to the content of the work order. Only provide suggestions and do not implement actual dispatch."
    script: skills/government_ticket/tools/dispatch_engine.py
    entry_point: execute
    inputSchema:
      type: object
      properties:
        content:
          type: string
          description: "Work order content"
          minLength: 1
          maxLength: 500
        ticket_type:
          type: string
          description: "Work order type"
          enum: ["complaint", "suggestion", "consultation"]
      required: [content, ticket_type]
      additionalProperties: false

  - name: ticket_store
    description: "Work order storage management: support the creation and query of work orders. Do not perform the deletion operation."
    script: skills/government_ticket/tools/ticket_store.py
    entry_point: execute
    inputSchema:
      type: object
      properties:
        action:
          type: string
          description: "Operation type"
          enum: ["create", "get_by_id", "get_by_phone", "list"]
        ticket_id:
          type: string
          description: "Work order number, format GH-YYYYMMDD-NNNN"
          pattern: "^GH-\\d{8}-\\d{4}$"
        ticket_type:
          type: string
          description: "Work order type"
          enum: ["complaint", "suggestion", "consultation"]
        content:
          type: string
          description: "Work order content"
          maxLength: 500
        dept_id:
          type: string
          description: "Undertaking department ID"
        dept_name:
          type: string
          description: "Name of the undertaking department"
        urgency_level:
          type: string
          description: "The degree of urgency"
          enum: ["critical", "urgent", "normal"]
        reporter_name:
          type: string
          description: "The name of the complainant"
          maxLength: 50
        reporter_phone:
          type: string
          description: "The complainant's mobile phone number"
          pattern: "^1[3-9]\\d{9}$"
        phone:
          type: string
          description: "The mobile phone number when querying by mobile phone number"
          pattern: "^1[3-9]\\d{9}$"
      required: [action]
      additionalProperties: false
